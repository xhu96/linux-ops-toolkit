[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opskit"
version = "0.1.0"
description = "AWS housekeeping CLI: ECR cleanup, tag compliance, idle resources, cost report"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[ec2,ecr,resourcegroupstaggingapi]>=5", "ruff>=0.7"]

[project.scripts]
opskit = "opskit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q --cov=opskit --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
